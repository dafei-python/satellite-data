name: dc-snapshot

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dc/tools/**'
      - '.github/workflows/dc-snapshot.yml'

concurrency:
  group: dc-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取并生成快照
        run: |
          set -e
          python3 dc/tools/build_snapshot.py
          ls -lh dc/data/snapshot/
      - name: 发布到 dc-data 分支
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/snap
          cp dc/data/snapshot/snapshot.json.gz dc/data/snapshot/build_info.json /tmp/snap/
          git checkout --orphan dc-data
          git rm -rf . >/dev/null
          cp /tmp/snap/snapshot.json.gz /tmp/snap/build_info.json .
          git add snapshot.json.gz build_info.json
          git commit -m "snapshot: $(date -u +%F)"
          git push -f origin dc-data
